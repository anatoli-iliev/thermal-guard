name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck -S warning thermal-guard install.sh uninstall.sh

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check every shell file
        run: |
          for f in thermal-guard install.sh uninstall.sh \
                   thermal-guard.conf.example examples/*.conf; do
            bash -n "$f" && echo "ok: $f"
          done
      - name: --version and --help must work anywhere
        run: |
          ./thermal-guard --version
          ./thermal-guard --help
      - name: --detect must SUCCEED without a config, a sensor or RAPL
        run: |
          # CI runners have no coretemp and no RAPL, which is exactly the
          # "hardware absent" path. --detect must still report what it found
          # and exit 0 — telling the user why it cannot help is the whole point.
          THERMAL_GUARD_CONFIG=/nonexistent ./thermal-guard --detect
          THERMAL_GUARD_CONFIG=/nonexistent ./thermal-guard --detect \
            | grep -q 'temperature source' || { echo "detect output malformed"; exit 1; }

      - name: the guard loop must refuse to start with no sensor
        run: |
          # Opposite of the above: actually running with nothing to measure is
          # a hard error, not a silent no-op.
          if timeout 10 env THERMAL_GUARD_CONFIG=/nonexistent ./thermal-guard; then
            echo "FAIL: started with no temperature sensor"; exit 1
          fi
          echo "correctly refused to run without a sensor"

      - name: Reject invalid configuration
        run: |
          set -e
          # NB: multi-word values need quotes inside the config file, since it is
          # sourced as shell. TIERS='80:11 85:7' unquoted would be a syntax error,
          # which is a different failure from the validation we are testing here.
          for bad in 'POLL_SEC=abc' 'CRIT_SAMPLES=0' 'CRIT_ACTION=banana' \
                     'NORMAL_WATTS=-5' 'CLAMP_PERF_PCT=101' 'DISABLE_TURBO=maybe' \
                     'TIERS="85:7 80:11"' 'TIERS="80:abc"' 'TIERS="80:0"' \
                     'TIERS="eighty:11"' 'TIER_SAMPLES=0' 'TIER_HYSTERESIS=0' \
                     'TIERS="200:11"'; do
            printf '%s\n' "$bad" > /tmp/tg.conf
            if THERMAL_GUARD_CONFIG=/tmp/tg.conf ./thermal-guard --detect >/dev/null 2>&1; then
              echo "FAIL: accepted invalid config: $bad"; exit 1
            fi
            echo "correctly rejected: $bad"
          done

      - name: Accept valid configuration including decimals
        run: |
          set -e
          for good in 'NORMAL_WATTS=10.5' 'POLL_SEC=0.5' 'CRIT_ACTION=log-only' \
                      'TIERS="80:11 85:7"' 'TIERS="75:13 80:11 85:7"' 'TIERS="85:7"' \
                      'NORMAL_WATTS=11
TIERS="85:7"'; do
            printf '%s\n' "$good" > /tmp/tg.conf
            THERMAL_GUARD_CONFIG=/tmp/tg.conf ./thermal-guard --detect >/dev/null \
              || { echo "FAIL: rejected valid config: $good"; exit 1; }
            echo "accepted: $good"
          done
