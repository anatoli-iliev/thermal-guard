name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Lint
        run: shellcheck -S warning thermal-guard install.sh uninstall.sh tests/run-tests.sh contrib/thermal-summary.sh contrib/thermal-clamps.sh

  smoke:
    name: smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Syntax check every shell file
        run: |
          for f in thermal-guard install.sh uninstall.sh \
                   thermal-guard.conf.example examples/*.conf; do
            bash -n "$f" && echo "ok: $f"
          done
      - name: --version and --help must work anywhere
        run: |
          ./thermal-guard --version
          ./thermal-guard --help
      - name: --detect must SUCCEED without a config, a sensor or RAPL
        run: |
          # CI runners have no coretemp and no RAPL, which is exactly the
          # "hardware absent" path. --detect must still report what it found
          # and exit 0 — telling the user why it cannot help is the whole point.
          THERMAL_GUARD_CONFIG=/nonexistent ./thermal-guard --detect
          THERMAL_GUARD_CONFIG=/nonexistent ./thermal-guard --detect \
            | grep -q 'temperature source' || { echo "detect output malformed"; exit 1; }

      - name: the guard loop must refuse to start with no sensor
        run: |
          # Opposite of the above: actually running with nothing to measure is
          # a hard error, not a silent no-op.
          if timeout 10 env THERMAL_GUARD_CONFIG=/nonexistent ./thermal-guard; then
            echo "FAIL: started with no temperature sensor"; exit 1
          fi
          echo "correctly refused to run without a sensor"

      - name: Reject invalid configuration
        run: |
          set -e
          # NB: multi-word values need quotes inside the config file, since it is
          # sourced as shell. TIERS='80:11 85:7' unquoted would be a syntax error,
          # which is a different failure from the validation we are testing here.
          for bad in 'POLL_SEC=abc' 'CRIT_SAMPLES=0' 'CRIT_ACTION=banana' \
                     'NORMAL_WATTS=-5' 'CLAMP_PERF_PCT=101' 'DISABLE_TURBO=maybe' \
                     'TIERS="85:7 80:11"' 'TIERS="80:abc"' 'TIERS="80:0"' \
                     'TIERS="eighty:11"' 'TIER_SAMPLES=0' 'TIER_HYSTERESIS=0' \
                     'TIERS="200:11"'; do
            printf '%s\n' "$bad" > /tmp/tg.conf
            if THERMAL_GUARD_CONFIG=/tmp/tg.conf ./thermal-guard --detect >/dev/null 2>&1; then
              echo "FAIL: accepted invalid config: $bad"; exit 1
            fi
            echo "correctly rejected: $bad"
          done

      - name: Accept valid configuration including decimals
        run: |
          set -e
          for good in 'NORMAL_WATTS=10.5' 'POLL_SEC=0.5' 'CRIT_ACTION=log-only' \
                      'TIERS="80:11 85:7"' 'TIERS="75:13 80:11 85:7"' 'TIERS="85:7"'; do
            printf '%s\n' "$good" > /tmp/tg.conf
            THERMAL_GUARD_CONFIG=/tmp/tg.conf ./thermal-guard --detect >/dev/null \
              || { echo "FAIL: rejected valid config: $good"; exit 1; }
            echo "accepted: $good"
          done

      - name: Accept a baseline budget combined with a ladder
        run: |
          printf 'NORMAL_WATTS=11\nTIERS="85:7"\n' > /tmp/tg.conf
          THERMAL_GUARD_CONFIG=/tmp/tg.conf ./thermal-guard --detect \
            | grep -q '85C->7W' || { echo "FAIL: ladder not parsed"; exit 1; }
          THERMAL_GUARD_CONFIG=/tmp/tg.conf ./thermal-guard --detect \
            | grep -qE 'baseline budget *: 11' || { echo "FAIL: baseline not applied"; exit 1; }
          echo "baseline + ladder parsed correctly"

  tests:
    name: test suite
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The whole suite: ground truth against the two measured points on the
      # reference machine, monotonicity of the budget across a temperature
      # sweep, the fail-safe path for unknown/stale/corrupt/hostile weather,
      # backward compatibility with every config that worked in v1.1.0, the
      # validation of all 29 new keys, and the JSON parser's security boundary.
      #
      # It needs no temperature sensor, no RAPL, no root and no network: all
      # physics goes through --simulate, hardware values are pinned by fixture
      # files and $THERMAL_GUARD_ASSUME_*, and stub curl/wget on PATH turn any
      # attempt to reach the network into a test failure.
      - name: Run tests/run-tests.sh
        run: bash tests/run-tests.sh

      # The privacy promise, asserted once more from outside the suite so it
      # cannot be weakened by a change inside it: with no adaptive keys set,
      # nothing this daemon does opens a socket.
      - name: The default configuration must never touch the network
        run: |
          mkdir -p /tmp/tg-stub /tmp/tg-state
          for p in curl wget; do
            printf '#!/bin/sh\ntouch /tmp/tg-network-was-used\nexit 1\n' > "/tmp/tg-stub/$p"
            chmod +x "/tmp/tg-stub/$p"
          done
          export PATH="/tmp/tg-stub:$PATH" THERMAL_GUARD_STATE=/tmp/tg-state
          export THERMAL_GUARD_ASSUME_TJMAX_C=105 THERMAL_GUARD_ASSUME_STOCK_W=17
          rm -f /tmp/tg-network-was-used
          : > /tmp/tg-empty.conf
          THERMAL_GUARD_CONFIG=/tmp/tg-empty.conf ./thermal-guard --detect      > /dev/null
          THERMAL_GUARD_CONFIG=/tmp/tg-empty.conf ./thermal-guard --simulate 25 > /dev/null
          printf 'ADAPTIVE=yes\nAMBIENT_C=25\n' > /tmp/tg-adaptive.conf
          THERMAL_GUARD_CONFIG=/tmp/tg-adaptive.conf ./thermal-guard --simulate ambient=25 > /dev/null
          THERMAL_GUARD_CONFIG=/tmp/tg-adaptive.conf ./thermal-guard --detect          > /dev/null
          timeout 8 env THERMAL_GUARD_CONFIG=/tmp/tg-empty.conf ./thermal-guard || true
          if [ -e /tmp/tg-network-was-used ]; then
            echo "FAIL: thermal-guard reached for the network"; exit 1
          fi
          echo "no network was used"
