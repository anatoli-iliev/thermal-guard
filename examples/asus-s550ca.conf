# Worked example — ASUS VivoBook S550CA (Intel i5-3317U, 2C/4T, 17 W TDP, 2012)
#
# This is a machine that dies BELOW Tjmax, which is the case thermal-guard exists
# for. Do not copy these numbers to another machine; copy the method.
#
# See also asus-s550ca-adaptive.conf, which sets no watt figure at all and lets
# the daemon derive one hourly from the outdoor temperature. Fed the 25 C ambient
# at which the 11 W below was measured, it arrives at the same answer.
#
# WHAT WAS MEASURED
#   Tjmax                        105 C   (from coretemp temp1_crit)
#   ACPI trip points             108 C / 110 C   -> above Tjmax, so the kernel's
#                                                   thermal shutdown can never fire
#   Actual death temperature      89-92 C, three crashes, consistent
#   CPU power at death            12.33 W of its 17 W rating
#   Thermal resistance             5.24 C/W  vs ~3.53 C/W for a healthy design
#                                            -> cooling at ~two-thirds of spec
#   Max sustainable power         ~10-11 W
#
# The trip was temperature-locked, not current-locked: it fired at 12.3 W and at
# 14 W alike, and the machine had previously sustained 14.2 W at 79 C without
# dying. So the fix is to stay away from the TEMPERATURE, by capping power.
#
# RESULT
#   10 W  ->  ~76 C, survived a workload that had killed it three times
#             (mean 1924 MHz vs 2394 MHz uncapped = 80% of previous performance)
#   11 W  ->  ~83 C predicted, ~89% of previous performance

# Two-thirds of the 17 W stock limit. Measured sustainable; it died at 12.33 W.
NORMAL_WATTS=11

# Emergency clamp. Roughly 7 W holds this chassis in the low 70s.
CLAMP_WATTS=7
CLAMP_PERF_PCT=40

# On a chassis that cannot dissipate its rated power, turbo drives the runaway.
DISABLE_TURBO=yes

# NOT the Tjmax-derived defaults (which would be 95/100/88) — those are useless
# here because this machine dies at 89 C, long before 95 C.
WARN_C=85          # clamp: 4 C below the observed kill zone
CRIT_C=88          # 1 C below the lowest observed death (89 C)
RECOVER_C=78       # 7 C hysteresis
CRIT_SAMPLES=3     # 6 s sustained, so a spike does not trigger it

# Deliberate choice on this machine: no automatic shutdowns. Consequence is that
# if the clamp cannot hold, the hardware still cuts power and unsaved work is
# lost. Set to poweroff to trade that for a clean shutdown.
CRIT_ACTION=throttle-only
