# Worked example — ASUS VivoBook S550CA, WEATHER-ADAPTIVE variant
#
# Same machine as asus-s550ca.conf (constant 11 W) and asus-s550ca-tiered.conf
# (the "80:11 85:7" ladder). This file sets NEITHER of those and lets the engine
# pick between them every hour, from the outdoor temperature where the laptop is.
#
# The point of this file is that it does not invent a third answer. Fed the
# ambient at which each of the other two examples was measured, it reproduces
# them exactly:
#
#   ambient 25 C (indoors, where 11 W was measured to settle at ~83 C)
#       -> TIERS="80:11 85:7"     byte-identical to asus-s550ca-tiered.conf
#   ambient 34 C (the balcony, where an 11 W ladder clamped over and over)
#       -> NORMAL_WATTS=9, emergency 6.30 W at 85 C
#
# Check it yourself, no hardware and no network required:
#   thermal-guard --simulate ambient=25
#   thermal-guard --simulate ambient=34
#   thermal-guard --simulate 34          # 34 C OUTDOORS, so the indoor transform applies
#   thermal-guard --simulate unknown     # the fail-safe path
#
# ---------------------------------------------------------------------------
# WHAT WAS MEASURED ON THIS MACHINE
# ---------------------------------------------------------------------------
#   Tjmax                        105 C  (coretemp temp1_crit)
#   ACPI trip points             108 C / 110 C -> above Tjmax, so the kernel's
#                                                 thermal shutdown never fires
#   Actual death temperature      89-92 C, three crashes, consistent
#   CPU power at death            12.33 W of its 17 W rating
#   Thermal resistance             5.24 C/W under load on AC   <- RTHETA_C_PER_W
#                                  (8.70 idle, 6.05 at 1 thread, 5.34 at 3 —
#                                   it stops improving once the fan saturates)
#   11 W settles at               ~83 C at 25 C ambient, ~92 C at 34 C
#   9 W settles at                ~81 C at 34 C ambient
#   7 W settles at                ~71 C at 34 C ambient
#   Idle cooldown floor           ~65 C at 25 C ambient (= 40 C above ambient)
#   Uncapped ramp rate            0.4-0.8 C/s under load
#   Power vs frequency            roughly linear, ~202 MHz per watt
#
# ---------------------------------------------------------------------------
# WHAT THIS CONFIG WILL ACTUALLY DO, BY SEASON
# ---------------------------------------------------------------------------
# PLACEMENT=indoor, so the outdoor reading becomes a room estimate first:
#   room = 22 + 0.35 x (outdoor - 22), floored at 22 C.
#
#   outdoor    room est.   budget   ladder?   what you feel
#   --------   ---------   ------   -------   -----------------------------------
#   -10 C      22.0 C      11.5 W   ladder    January. HALF A WATT MORE than the
#   0 C        22.0 C      11.5 W   ladder    hand-tuned 11 W — the cold really
#   15 C       22.0 C      11.5 W   ladder    does buy it, and 11.5 W at a 22 C
#                                             room predicts 82.3 C, still under
#                                             the 83 C target.
#   25 C       23.1 C      11 W     ladder    Spring. Exactly the shipped ladder.
#   30 C       24.8 C      11 W     ladder    A warm day indoors is still fine.
#   34 C       26.2 C      10.5 W   ladder    Heatwave, but INDOORS. One step down.
#   40 C       28.3 C      10 W     ladder    Two steps down.
#   45 C       30.0 C      10 W     ladder    Absurd, and still a ladder, because
#                                             a room does not become a balcony.
#
# Note what does NOT happen indoors: the mode never flips to a constant cap. It
# would need a room above ~32 C, i.e. an outdoor reading above 50 C. That is
# correct — the failure that motivated this whole feature was measured OUTDOORS,
# on a balcony, with the machine in the actual 34 C air. If you take this laptop
# outside, set PLACEMENT=outdoor and it will pick the flat 9 W cap instead.
#
# And when the network is down, the weather is stale, or the reading is nonsense:
#   ambient assumed 35 C -> constant 9 W, no ladder, reason=ambient-unknown.
# That is the 9 W the measurements say survives the hottest condition ever tested
# on this machine. The budget only ever goes UP on evidence, never on a guess.

# ---------------------------------------------------------------------------
# THE CONFIG
# ---------------------------------------------------------------------------

ADAPTIVE=yes
PLACEMENT=indoor

# LOCATION=auto resolves coordinates from this machine's IP once, then caches
# them in /var/lib/thermal-guard/location (mode 0600). Behind a VPN that puts
# you in the wrong country, so set the two numbers instead — it is also the
# option that never sends your IP anywhere:
#LATITUDE=42.7
#LONGITUDE=23.3
LOCATION=auto

# MEASURED, not assumed. Everything else here scales linearly with this number.
# (83 - 25) / 11 W = 5.27, and a proper sustained run gave 5.24. Without it the
# engine would assume (105 - 40) / 17 x 1.4 = 5.35, which lands one 0.5 W step
# more conservative — safe, but it is a guess, and this is not.
RTHETA_C_PER_W=5.24

# Also measured, and pinned here for a reason worth understanding.
#
# Left empty, both of these are derived from the DETECTED stock power limit —
# and "detected" means whatever /var/lib/thermal-guard/stock-power-limit-uw says,
# which is a copy of the RAPL register taken the first time the guard ever ran.
# If that first run happened while an earlier experiment had already capped the
# package, the file records the CAP as though it were stock, and every value
# derived from it is wrong for the rest of the machine's life.
#
# Check yours:  cat /var/lib/thermal-guard/stock-power-limit-uw   # want 17000000
# Fix it:       sudo systemctl stop thermal-guard
#               sudo rm /var/lib/thermal-guard/stock-power-limit-uw
#               # reboot so the register returns to its true stock value, then
#               sudo systemctl start thermal-guard
#
# On this machine the file read 11000000 — the 11 W cap, not the 17 W TDP. The
# consequence is not subtle: the derived idle rise becomes 0.45 x 5.24 x 11 =
# 25.9 C instead of the measured 40 C, the burst window is overstated by 14 C,
# and the engine then builds a LADDER at 34 C ambient — precisely the decision
# that was measured to be slower than a flat cap. Pinning the two measured
# numbers makes this config correct whatever the state file happens to contain.
LADDER_IDLE_RISE_C=40   # measured: idle floor ~65 C at 25 C ambient
BUDGET_MAX_W=17         # the real 17 W TDP of the i5-3317U

# THE MOST IMPORTANT LINE IN THE FILE.
#
# The adaptive budget is solved backwards from CRIT_C: the die target is
# CRIT_C - 5 = 83 C, and every watt figure above follows from that. The
# Tjmax-derived default would be CRIT_C = 100 C, a target of 95 C, and a budget
# of 13 W — which on this machine is a shutdown, because it dies at 89 C.
#
# 88 C is 1 C below the lowest observed death across three recorded crashes.
CRIT_C=88

# Not Tjmax-derived either (which would be 95 / 88). WARN_C is where the engine's
# CONSTANT-mode emergency rung goes, and RECOVER_C sets its release hysteresis.
WARN_C=85
RECOVER_C=78
CRIT_SAMPLES=3

# Used as the release hysteresis for the generated LADDER, and it is load-bearing
# there: the engine refuses to build a top rung whose own settling temperature
# sits above its release point, because such a rung can never let go. That is
# exactly the balcony failure — a 7 W clamp that stayed engaged for 11+ minutes.
TIER_SAMPLES=3
TIER_HYSTERESIS=7

CLAMP_PERF_PCT=40

# On a chassis that cannot dissipate its rated power, turbo drives the runaway.
DISABLE_TURBO=yes

# Deliberate on this machine: no automatic shutdowns, ever. The consequence is
# real — if the cap cannot hold, the hardware still cuts power and unsaved work
# is lost. That trade is the owner's to make, and it is made here.
CRIT_ACTION=throttle-only

RESTORE_ON_EXIT=yes

# ---------------------------------------------------------------------------
# DELIBERATELY NOT SET
# ---------------------------------------------------------------------------
# NORMAL_WATTS, TIERS and CLAMP_WATTS are all left empty, and that is what hands
# the plan to the engine. Set ANY of the three and the engine drops to advisory
# for good: it still prints what it would have chosen and warns when your number
# is above what today's ambient supports, but it changes nothing. Your numbers
# always win — that is the rule, not a special case.
#NORMAL_WATTS=
#TIERS=
#CLAMP_WATTS=

# AMBIENT_OFFSET_C is the knob to reach for if this does not match your room.
# Put a thermometer next to the laptop, run `thermal-guard --detect`, and compare
# it with the "ambient in use" line. The difference goes here. Positive means a
# hotter room than the model thinks, and therefore a lower budget.
#AMBIENT_OFFSET_C=0

# HONEST CAVEAT, because this file is a worked example and not a sales pitch.
# The indoor ladder is marginal, not comfortable: 11 W settles at ~82.6 C against
# an 85 C top rung, so 2.4 C of margin, and overshoot past a rung is 2-4 C. The
# 3 C between the top rung and CRIT_C=88 is what absorbs that. If you would
# rather be slow than sorry, ADAPTIVE_MODE=constant gives up the burst
# performance and keeps the same physics.
#ADAPTIVE_MODE=constant
