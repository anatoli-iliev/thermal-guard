# The recommended starting point if you are not the author of this tool.
#
# Four keys. The daemon works out the rest of the budget from your hardware and
# the weather where you are, and re-decides once an hour.
#
# READ THIS BEFORE YOU USE IT, because two of the defaults are guesses about a
# machine nobody has measured — yours:
#
#   1. CRIT_C is not set here, so it defaults to Tjmax - 5. That is right for a
#      machine that throttles normally. It is WRONG, and dangerously generous,
#      for a machine that cuts power below Tjmax — which is the case this whole
#      tool exists for. The adaptive budget is solved backwards from CRIT_C, so
#      a CRIT_C that is a guess produces a budget that is a guess. If your
#      machine has ever died under load, read the trace, find the temperature it
#      died at, and set CRIT_C a degree or two below it FIRST. The daemon warns
#      about this at startup and in `--detect`; the warning is not boilerplate.
#
#   2. RTHETA_C_PER_W is not set, so the daemon assumes your cooling is
#      (Tjmax - 40) / stock_watts x 1.4 degrees per watt. On the one machine
#      where both are known, the assumption came out 2% pessimistic — but that
#      is one machine. Measuring it takes ten minutes and is worth more than
#      every other knob in this file combined. `--detect` prints the recipe.
#
# See what this config would do, before it does it — no root, no network:
#     thermal-guard --detect
#     thermal-guard --simulate 30          # if it were 30 C outside
#     thermal-guard --simulate unknown     # if the weather were unreachable

# Turn the engine on. Without this line nothing below has any effect at all.
ADAPTIVE=yes

# indoor  — the fetched outdoor temperature becomes a room estimate first
# outdoor — the machine is in the actual outside air (balcony, van, shed)
PLACEMENT=indoor

# Resolve coordinates from this machine's IP, once, and cache them. Behind a VPN
# this lands you in the wrong country: set LATITUDE and LONGITUDE instead, which
# also means your IP is never sent anywhere.
LOCATION=auto

# The one knob to reach for when the model does not match your room. Put a
# thermometer next to the machine, run `thermal-guard --detect`, and compare with
# the "ambient in use" line. The difference goes here. Positive = hotter room
# than the model thinks = lower budget.
AMBIENT_OFFSET_C=0

# ---------------------------------------------------------------------------
# WHAT THIS COSTS YOU
# ---------------------------------------------------------------------------
# NETWORK. One HTTPS GET per hour to api.open-meteo.com carrying nothing but
# coordinates rounded to ~11 km, plus ONE request to get.geojs.io because
# LOCATION=auto — that one is cached on disk and never repeated. Delete LOCATION
# and set AMBIENT_C instead to keep the whole engine with no network at all; see
# adaptive-offline.conf. The full accounting is in thermal-guard.conf.example
# under PRIVACY.
#
# PERFORMANCE AT STARTUP. With no NORMAL_WATTS and no TIERS, the engine owns the
# plan, which means the machine starts CAPPED at the conservative fallback
# budget and only relaxes once the first weather reading lands, usually within a
# few minutes. That is the fail-safe direction and it is deliberate.
