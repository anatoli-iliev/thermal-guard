# Adaptive physics, zero network.
#
# For an air-gapped machine, a locked-down build, or anyone who wants the budget
# solver without a daemon that talks to strangers. AMBIENT_C suppresses ALL
# network use — no weather, no geolocation, nothing is resolved, nothing is sent,
# and no coordinates are ever written to disk. The rule the daemon prints in
# `--detect` is exact: it touches the network if and only if ADAPTIVE=yes AND
# AMBIENT_C is empty. This file is the second half of that "and".
#
# WHAT YOU STILL GET
#   The equation:      die = ambient + Rtheta x watts, solved for watts at a
#                      target below CRIT_C, quantised down to a 0.5 W grid.
#   The shape choice:  ladder while there is real headroom below the first rung,
#                      a flat cap when there is not.
#   The safety rails:  CRIT_C, the emergency rung, the release check, the trace.
#
# WHAT YOU GIVE UP
#   The hourly update. AMBIENT_C never expires, so it is exactly as right as it
#   was on the day you typed it. A number chosen in March is a liability in July,
#   and the failure is silent — the daemon cannot know the room got hotter.
#
#   So pick a number for the WORST room you will actually work in, not today's.
#   If you would rather it were right in summer and merely slow in winter, that
#   is the correct direction to be wrong in.
#
# TUNE IT PROPERLY, ONCE
#   Put a thermometer next to the machine. Run a sustained load until the
#   temperature stops climbing. Then:
#       AMBIENT_C      = what the thermometer says
#       RTHETA_C_PER_W = (die temperature - AMBIENT_C) / package watts
#   Ten minutes of work, and it replaces every guess in this file.
#
#   Check the result before trusting it:
#       thermal-guard --detect
#       thermal-guard --simulate ambient=30    # a hotter room than you set
#       thermal-guard --simulate ambient=35    # summer

ADAPTIVE=yes

# The ambient AT THE MACHINE, in degrees C. Setting this is what disables the
# network. There is no placement transform and no AMBIENT_OFFSET_C applied to
# it: this number is taken literally.
AMBIENT_C=25

# Measure this. The whole budget scales linearly with it, and the derived
# fallback is an assumption about a machine nobody has seen.
#RTHETA_C_PER_W=5.24

# SET THIS FROM YOUR OWN TRACE if your machine has ever died under load. The
# default is Tjmax - 5, which is only right for a machine that throttles
# normally rather than cutting power early. Everything the engine computes is
# measured downward from this line.
#CRIT_C=88

# PLACEMENT, LOCATION, LATITUDE, LONGITUDE, WEATHER_URL, GEOIP_URL and every
# WEATHER_* timing key are all inert while AMBIENT_C is set. The daemon warns at
# startup if you leave a location key set alongside it, so a config that looks
# like it fetches weather but does not cannot pass unnoticed.
