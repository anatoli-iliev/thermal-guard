# Worked example — ASUS VivoBook S550CA, TEMPERATURE LADDER variant
#
# Same machine as asus-s550ca.conf, but running unlimited while cool instead of
# permanently capped. Compare the two before choosing.
#
# MEASURED ON THIS MACHINE
#   Tjmax                    105 C
#   Dies at                   89-92 C, while drawing only ~12.3 W of 17 W
#   11 W settles at           ~83 C indoors, ~92 C at 34 C ambient
#   7 W settles at            ~71 C at 34 C ambient
#   Uncapped ramp rate        ~0.4-0.8 C/s under load
#
# THE LADDER
#   unlimited   while below 80 C   — full speed for interactive work
#   80 C -> 11 W                   — measured sustainable indoors
#   85 C -> 7 W  + 40% perf        — emergency; 4 C below the death floor
#
# HONEST TRADE-OFF
#   A constant 11 W cap (asus-s550ca.conf) never lets the die near 85 C. This
#   ladder does, then relies on reacting. With 2 s polling and a 0.4-0.8 C/s
#   ramp, overshoot past a rung of 2-4 C is expected, so touching 87-89 C is
#   possible — and 89 C is where this machine has actually died.
#
#   Indoors that is an acceptable bet: 11 W settles at ~83 C, below the 85 C
#   rung, so the top rung should rarely fire.
#
#   Outdoors (34 C ambient) it is NOT: 11 W projects to ~92 C, so the ladder
#   goes straight to 7 W and oscillates. Use a constant 9 W cap instead —
#   ~81 C steady, no laddering.

TIERS="80:11 85:7"
TIER_SAMPLES=3
TIER_HYSTERESIS=7
CLAMP_PERF_PCT=40

# No baseline: unlimited until the first rung.
#NORMAL_WATTS=

DISABLE_TURBO=yes

# Above the top rung, and 1 C below the lowest observed death temperature.
CRIT_C=88
CRIT_SAMPLES=3

# Deliberate: no automatic shutdowns. If the ladder cannot hold, the hardware
# cuts power as before and unsaved work is lost.
CRIT_ACTION=throttle-only

RESTORE_ON_EXIT=yes
